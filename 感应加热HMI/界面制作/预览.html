<!doctype html><html lang="zh-CN"><meta charset="utf-8"><title>感应加热 HMI 页面预览</title><style>body{margin:24px;background:#e9edf2;color:#29313e;font:16px Microsoft YaHei}nav{display:flex;gap:8px;flex-wrap:wrap;margin:16px 0}button{padding:10px 18px;border:0;background:white;cursor:pointer}button.active{background:#137de1;color:white}img{display:block;width:min(100%,1000px);box-shadow:0 10px 35px #0002}p{color:#6d7785}</style><h2>感应加热 · HMI 界面预览</h2><p>800×480 · 原生工程页面的离线渲染预览 · 初始数据为空</p><nav><button onclick="show(0,this)">运行总览</button><button onclick="show(1,this)">分段温控</button><button onclick="show(2,this)">温度曲线</button><button onclick="show(3,this)">功率曲线</button><button onclick="show(4,this)">频率曲线</button><button onclick="show(5,this)">保护报警</button><button onclick="show(6,this)">相位差曲线</button><button onclick="show(7,this)">参数输入</button></nav><img id="screen"><p>本页仅预览外观。按钮事件、参数键盘保存在 .HMI 工程中，需编辑器编译验证。</p><script>const files=["预览/00_运行总览.png", "预览/01_分段温控.png", "预览/02_曲线调试温度.png", "预览/03_曲线调试功率.png", "预览/04_曲线调试频率.png", "预览/05_保护报警.png", "预览/06_曲线调试相位.png", "预览/07_参数输入.png"];function show(i,b){document.getElementById("screen").src=files[i];document.querySelectorAll("button").forEach(x=>x.classList.remove("active"));b.classList.add("active")}show(0,document.querySelector("button"));</script></html>
